<!DOCTYPE html>
<html lang="en">

<head>
  <title>Form Example1</title>
</head>

<body>
  <form name="login" method="get">
    <table align="center" cellpadding="5px" cellspacing="5px">
      <caption>
        <h2>Amazon User Login Form</h2>
      </caption>
      <tr>
        <td>
          <label for="id1">UserId</label>
        </td>
        <td>
          <input type="text" id="id1" name="name1" placeholder="Type Your Id Here" required>
        </td>
      </tr>
      <tr>
        <td>
          <label for="id2"> Password </label>
        </td>
        <td>
          <input type="password" id="id2" name="name2" placeholder="Type Your Pin Here" required>
        </td>
      </tr>
      <tr>
        <td> <input type="submit" value="Login"> </td>
        <td> <input type="reset" value="Erase"> </td>
      </tr>
    </table>
  </form>
</body>

</html>
